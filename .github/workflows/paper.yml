name: JOSS paper

# Builds paper/paper.md to PDF with the Open Journals action — the same
# toolchain JOSS uses — so a broken citation or front-matter key is caught
# here, not at submission. The PDF is uploaded as a workflow artifact.

on:
  push:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["paper/**"]
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
